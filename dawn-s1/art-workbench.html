<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>逍遥行 · 招式工作台</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0E1219;color:#E8DFC8;font:13px/1.6 "Microsoft YaHei",SimSun,monospace}
header{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#161C26;border-bottom:1px solid #3A352A;flex-wrap:wrap}
h1{font-size:16px;font-weight:500;margin:0 10px 0 0;color:#F2D089;letter-spacing:2px}
button,select,input{font:12px SimSun,monospace;background:#222A36;color:#E8DFC8;border:1px solid #4A5568;padding:4px 7px}
button{cursor:pointer}
button:hover{background:#2F6E6A;border-color:#5FA8A0}
button.hot{background:#8A6520;border-color:#D9A441;color:#FFF3D4}
.sep{width:1px;height:22px;background:#3A352A;margin:0 4px}
.wrap{display:grid;grid-template-columns:205px minmax(360px,1fr) 285px;gap:9px;padding:9px;height:calc(100vh - 108px);min-height:570px}
.pane{background:#161C26;border:1px solid #3A352A;overflow:auto;padding:8px}
.pane h2{font-size:13px;font-weight:500;margin:2px 0 8px;color:#F2D089;letter-spacing:1px}
.grp{font-size:11px;color:#9BD4CC;margin:9px 0 3px;letter-spacing:1px}
.it{display:block;width:100%;text-align:left;padding:3px 7px;margin:1px 0;background:#1D2430;border:1px solid transparent;font-size:12px}
.it:hover{background:#2A3546}
.it.on{background:#2F6E6A;border-color:#5FA8A0;color:#FFF3D4}
.it i{float:right;font-style:normal;color:#D9A441}
.stage{display:flex;flex-direction:column;gap:8px}
canvas{width:100%;max-height:400px;background:#12161F;border:1px solid #3A352A;image-rendering:pixelated}
.ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctrl .fr{margin-left:auto;font:12px monospace;color:#F2D089}
.tl{background:#1D2430;border:1px solid #3A352A;padding:7px}
.bar{position:relative;height:26px;background:#12161F;border:1px solid #4A5568;margin-bottom:7px;overflow:hidden}
.seg{position:absolute;top:0;bottom:0;opacity:.85}
.ptr{position:absolute;top:0;bottom:0;width:2px;background:#FFFFFF;z-index:3}
.rows{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.rows label{font-size:10px;color:#9BD4CC;display:block;text-align:center}
.rows input{width:100%;text-align:center;padding:2px}
.row{display:flex;align-items:center;gap:6px;margin:5px 0}
.row>span{width:74px;flex:0 0 auto;font-size:11px;color:#9BD4CC}
.row input,.row select{flex:1;min-width:0}
.sw{display:flex;gap:3px;flex-wrap:wrap;margin:4px 0 8px}
.sw button{width:20px;height:20px;padding:0;border:1px solid #4A5568}
.frames{display:flex;gap:3px;flex-wrap:wrap;max-height:92px;overflow:auto;margin:5px 0}
.frames img{width:34px;height:34px;object-fit:contain;background:#0E1219;border:1px solid #3A352A}
.note{font-size:11px;color:#8A8268;line-height:1.6}
footer{padding:7px 12px;background:#161C26;border-top:1px solid #3A352A;font-size:11px;color:#8A8268;display:flex;gap:16px;flex-wrap:wrap}
#status{color:#9BD4CC}
</style>
</head>
<body>
<header>
  <h1>招式工作台</h1>
  <button id="btnPlay" class="hot">播放</button>
  <button id="btnStep">下一帧</button>
  <button id="btnReset">回到第 0 帧</button>
  <select id="selSpeed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
  <div class="sep"></div>
  <button id="btnPng">导入 PNG 素材</button>
  <input id="pngFile" type="file" accept="image/png,image/*" hidden>
  <div class="sep"></div>
  <button id="btnJson" class="hot">下载覆盖表 JSON</button>
  <button id="btnData" class="hot">下载 art-overrides.data.js</button>
  <button id="btnTry">写入试玩</button>
  <button id="btnCopy">复制导入码</button>
  <button id="btnImport">导入草稿 JSON</button>
  <input id="jsonFile" type="file" accept=".json,application/json" hidden>
  <button id="btnClear">清空草稿</button>
</header>

<div class="wrap">
  <div class="pane" id="listPane">
    <h2>80 招基线</h2>
    <input id="search" placeholder="搜招式名 / id" style="width:100%">
    <div id="list"></div>
  </div>

  <div class="pane stage">
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="ctrl">
      <span class="note">预览是示意画法，判定仍由游戏的 14 种原语负责</span>
      <span class="fr" id="frameInfo">第 0 / 0 帧</span>
    </div>
    <div class="tl">
      <div class="bar" id="bar"><div class="ptr" id="ptr"></div></div>
      <div class="rows">
        <label>总帧<input id="tl_total" type="number" min="6" max="120"></label>
        <label>起手帧<input id="tl_windup" type="number" min="0" max="120"></label>
        <label>命中帧<input id="tl_hit" type="number" min="0" max="120"></label>
        <label>刀光起帧<input id="tl_fxStart" type="number" min="0" max="120"></label>
        <label>刀光帧数<input id="tl_fxLen" type="number" min="1" max="120"></label>
        <label>收招帧<input id="tl_recover" type="number" min="0" max="120"></label>
      </div>
      <div class="note" id="tlHint"></div>
    </div>
  </div>

  <div class="pane" id="propPane">
    <h2 id="propTitle">选一招开始</h2>
    <div id="props"></div>
  </div>
</div>

<footer>
  <span id="status">就绪</span>
  <span>三步：选招 → 调形状/帧数/素材 → 下载 JSON，在游戏「招式」页点「导入工作台覆盖表」</span>
  <span>把 data.js 放进 dawn-s1/ 覆盖同名文件，再 node build.js 即永久生效</span>
</footer>

      ring(shR);
      for (i = 0; i < num(sp.count, 8); i++) line(ang + i / num(sp.count, 8) * Math.PI * 2, shR * 0.52, num(sp.w, 1.2));
      if (sp.double) ring(shR * 1.32);
    } else if (k === 'cleave') {
      var cl = R * 1.15 * num(sp.len, 1);
      line(ang, cl, num(sp.w, 3));
      if (sp.twin) { line(ang + 0.24, cl * 0.9, 2); line(ang - 0.24, cl * 0.9, 2); }
      for (i = 1; i <= 3; i++) lineAt(x + Math.cos(ang) * cl * i / 3, y + Math.sin(ang) * cl * i / 3, ang + Math.PI / 2, cl * 0.16, 1.4);
    } else if (k === 'boom') {
      arc(ang - 0.55 * num(sp.wide, 1), ang + 0.55 * num(sp.wide, 1), R * 0.92);
      for (i = 1; i <= 5; i++) dot(Math.cos(ang) * R * 0.9 * i / 5, Math.sin(ang) * R * 0.9 * i / 5, 3 - i * 0.4);
      if (sp.flat) line(ang, R * 0.85, 1.2);
      if (sp.high) line(ang - 1.05, R * 0.5, 1.2);
    } else if (k === 'charge') {
      var chl = R * 1.3 * num(sp.len, 1);
      line(ang, chl, num(sp.w, 1.2));
      for (i = 1; i <= 5; i++) dot(Math.cos(ang) * chl * i / 5, Math.sin(ang) * chl * i / 5, 3);
      for (i = 0; i < num(sp.dust, 0); i++) {
        var du = i / Math.max(1, num(sp.dust, 0));
        g.beginPath(); g.arc(x + Math.cos(ang) * chl * du, y + Math.sin(ang) * chl * du, 2.5, 0, Math.PI * 2); g.fill();
      }
    }
  }
  function drawShape(x, y, ang, reach, col, alpha, shape, shv) {
    // 与 game.js artSwingFx 的 shv 后处理同一把尺子：预览里也要看得出变体
    var R = Math.min(96, Math.max(24, reach * 1.1)) * (1 + ((shv || 1) - 1) * 0.055);
    g.save(); g.globalAlpha = Math.max(0, Math.min(1, alpha));
    g.strokeStyle = col[0]; g.fillStyle = col[1] || col[0]; g.lineWidth = 3; g.lineCap = 'round';
    function line(a, len, w) {
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
      g.lineWidth = w || 3; g.stroke();
    }
    function ring(r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke(); }
    function arc(a0, a1, r) { g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke(); }
    function dot(dx, dy, r) { g.beginPath(); g.arc(x + dx, y + dy, r, 0, Math.PI * 2); g.fill(); }
    // P12-E：61 种新刀光走规格表
    var sp = (BASE.shapeSpecs || {})[shape];
    if (sp) { drawSpec(sp, ang, R); g.restore(); return; }
    switch (shape) {
      case 'point': dot(Math.cos(ang) * R, Math.sin(ang) * R, 8); for (var i = 0; i < 4; i++) line(ang + (i - 1.5) * 0.4, 16, 1); break;
      case 'overheadArc': line(Math.PI / 2, 34, 3); arc(ang - 0.6, ang + 0.6, R); break;
      case 'shockwave': ring(R * 0.7); ring(R * 0.45); for (var j = 0; j < 8; j++) line(j / 8 * Math.PI * 2, R * 0.8, 1); break;
      case 'crack': for (var c = 0; c < 4; c++) dot(Math.cos(ang) * R * (c + 1) / 4, Math.sin(ang) * R * (c + 1) / 4, 4 - c); break;
      case 'cleave': line(ang, R * 1.25, 5); line(ang, R, 2); break;
      case 'boomerang': arc(ang - 1.0, ang + 1.0, R * 0.8); line(ang + 1.0, R * 0.5, 3); break;
      case 'sideArc': arc(ang - 1.3, ang + 0.2, R); break;
      case 'chargeLine': line(ang, R * 1.4, 3); line(ang + 0.25, R * 1.1, 1); line(ang - 0.25, R * 1.1, 1); break;
      case 'plant': line(Math.PI / 2, 30, 4); dot(0, 0, 5); break;
      case 'arc': arc(ang - 0.8, ang + 0.8, R); break;
      case 'ring': ring(R); break;
      case 'thrust': line(ang, R * 1.2, 4); break;
      case 'fan': for (var f = -2; f <= 2; f++) line(ang + f * 0.22, R, 2); break;
      case 'cross': line(ang - 0.6, R, 3); line(ang + 0.6, R, 3); break;
      case 'rain': for (var d = 0; d < 6; d++) { var px = (d - 2.5) * 18; g.beginPath(); g.moveTo(x + px, y - 50); g.lineTo(x + px, y - 18); g.stroke(); } break;
      case 'sigil': ring(R * 0.7); ring(R * 0.4); for (var s = 0; s < 6; s++) line(s / 6 * Math.PI * 2, R * 0.6, 1); break;
      case 'trail': for (var t = 1; t <= 4; t++) line(ang + (t % 2 ? 0.2 : -0.2), R * t / 4, 2); break;
      case 'spiral': arc(ang - 1.2, ang + 2.6, R); ring(R * 0.45); break;
      case 'hook': line(ang, R, 3); line(ang + 1.95, R * 0.45, 3); break;
      default: arc(ang - 0.8, ang + 0.8, R);
    }
    g.restore();
  }
  function draw() {
    var W = cv.width, H = cv.height;
    g.fillStyle = '#12161F'; g.fillRect(0, 0, W, H);
    g.strokeStyle = '#222A36'; g.lineWidth = 1;
    for (var xx = 0; xx < W; xx += 32) { g.beginPath(); g.moveTo(xx, 0); g.lineTo(xx, H); g.stroke(); }
    for (var yy = 0; yy < H; yy += 32) { g.beginPath(); g.moveTo(0, yy); g.lineTo(W, yy); g.stroke(); }
    g.strokeStyle = '#3A352A'; g.beginPath(); g.moveTo(0, 250); g.lineTo(W, 250); g.stroke();
    var a = cur();
    if (!a) { g.fillStyle = '#8A8268'; g.font = '14px SimSun'; g.fillText('左边选一招', 24, 40); return; }
    var t = a.timeline, total = Math.max(1, t.total);
    var p = Math.min(1, frame / total), e = ease(p, a.pose.ease);
    var cx = 260, cy = 220, ang = weaponAng(a.pose, e);
    // 角色剪影
    g.fillStyle = '#4A5568'; g.fillRect(cx - 7, cy - 34, 14, 30);
    g.fillStyle = '#C9BFA3'; g.fillRect(cx - 6, cy - 50, 12, 12);
    g.fillStyle = '#2A3140'; g.fillRect(cx - 9, cy - 4, 7, 14); g.fillRect(cx + 2, cy - 4, 7, 14);
    // 武器
    var hx = cx, hy = cy - 24, len = 46;
    g.strokeStyle = a.color[0]; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(hx, hy); g.lineTo(hx + Math.cos(ang) * len, hy + Math.sin(ang) * len); g.stroke();
    g.fillStyle = a.color[1] || a.color[0];
    g.fillRect(hx + Math.cos(ang) * len - 3, hy + Math.sin(ang) * len - 3, 6, 6);
    // 刀光
    if (frame >= t.fxStart && frame <= t.fxStart + t.fxLen) {
      var k = (frame - t.fxStart) / Math.max(1, t.fxLen);
      drawShape(hx + Math.cos(ang) * 22, hy + Math.sin(ang) * 22, ang, a.reach, a.color, 1 - k * 0.75, a.shape, a.shv);
      var ims = frameImgs[a.id] || [];
      if (ims.length) {
        var idx = Math.min(ims.length - 1, Math.floor(k * ims.length));
        var im = ims[idx];
        if (im && im.complete && im.naturalWidth) {
          var sc = a.frameScale || 1, w = im.naturalWidth * sc, h = im.naturalHeight * sc;
          g.save(); g.globalAlpha = Math.min(1, (1 - k) * 1.4);
          g.translate(hx + Math.cos(ang) * 34, hy + Math.sin(ang) * 34);
          if (a.frameRotate) g.rotate(ang);
          g.drawImage(im, -w / 2, -h / 2, w, h); g.restore();
        }
      }
    }
    // 命中帧
    if (frame === t.hit) {
      g.strokeStyle = '#C8453B'; g.lineWidth = 2;
      g.beginPath(); g.arc(hx + Math.cos(ang) * 60, hy + Math.sin(ang) * 60, 26, 0, Math.PI * 2); g.stroke();
    }
    g.fillStyle = '#E8DFC8'; g.font = '13px SimSun';
    g.fillText(a.name + ' · ' + a.fam + ' · ' + a.fx, 16, 26);
    g.fillStyle = '#9BD4CC'; g.font = '11px monospace';
    g.fillText(a.shape + '@' + (a.shv || 1) + ' / ' + a.pose.mode + ' / ' + a.snd + '→' + a.hitSnd, 16, 44);
    g.fillStyle = '#8A8268';
    g.fillText('第 ' + frame + ' 帧  ' + (frame < t.windup ? '起手' : frame < t.hit ? '发力' : frame <= t.fxStart + t.fxLen ? '刀光' : '收招'), 16, H - 16);
  }
  function loop(ts) {
    if (playing) {
      if (!lastT) lastT = ts;
      acc += (ts - lastT) / 1000 * FPS * speed;
      lastT = ts;
      if (acc >= 1) {
        var step = Math.floor(acc); acc -= step; frame += step;
        var total = cur() ? cur().timeline.total : 30;
        if (frame > total) frame = 0;
        updatePointer();
      }
    } else lastT = 0;
    draw(); requestAnimationFrame(loop);
  }
  $('btnPlay').onclick = function () { playing = !playing; $('btnPlay').textContent = playing ? '暂停' : '播放'; };
  $('btnStep').onclick = function () { frame++; var t = cur() ? cur().timeline.total : 30; if (frame > t) frame = 0; updatePointer(); };
  $('btnReset').onclick = function () { frame = 0; updatePointer(); };
  $('selSpeed').onchange = function () { speed = Number(this.value) || 1; };
  $('search').oninput = renderList;

  // ---------- 导出 ----------
  function buildPack() {
    var arts = {};
    Object.keys(draft).forEach(function (id) {
      var b = ARTS[id]; if (!b) return;
      var a = curFor(id), o = {};
      ['shape', 'shv', 'snd', 'hitSnd', 'mul', 'cd', 'cost', 'reach', 'arc', 'name', 'desc'].forEach(function (k) {
        if (a[k] !== b[k]) o[k] = a[k];
      });
      if (JSON.stringify(a.color) !== JSON.stringify(b.color)) o.color = a.color;
      var pose = Object.assign({}, a.pose, { dur: a.timeline.total / a.timeline.fps });
      if (JSON.stringify(pose) !== JSON.stringify(b.pose)) o.pose = pose;
      o.timeline = a.timeline;
      o.fxDelay = a.timeline.fxStart / a.timeline.fps;
      o.fxLife = a.timeline.fxLen / a.timeline.fps;
      if (a.frames && a.frames.length) {
        o.frames = a.frames; o.frameScale = a.frameScale || 1; o.frameRotate = !!a.frameRotate;
      }
      arts[id] = o;
    });
    return { version: 1, arts: arts };
  }
  function curFor(id) {
    var b = ARTS[id], d = draft[id] || {}, o = {};
    for (var k in b) o[k] = b[k];
    for (var k2 in d) if (k2 !== 'pose' && k2 !== 'timeline') o[k2] = d[k2];
    o.pose = Object.assign({}, b.pose, d.pose || {});
    o.timeline = Object.assign(defaultTimeline(b), d.timeline || {});
    o.color = d.color || b.color;
    return o;
  }
  // 把导出的覆盖表读回草稿：每招只留工作台认得的字段，结构字段（id/fam/slot）丢掉。
  // 这样「下载 JSON → 换台机器继续改 → 再导出」是闭环的。
  function importPack(txt) {
    var j = typeof txt === 'string' ? JSON.parse(txt) : txt;
    var src = (j && j.arts) || {};
    Object.keys(src).forEach(function (id) {
      if (!ARTS[id]) return;
      var row = src[id], d = { timeline: row.timeline };
      ['shape', 'shv', 'snd', 'hitSnd', 'mul', 'cd', 'cost', 'reach', 'arc', 'color', 'pose', 'frames', 'frameScale', 'frameRotate'].forEach(function (k) {
        if (row[k] !== undefined && k !== 'timeline') d[k] = row[k];
      });
      draft[id] = d;
      if (d.frames) setFrameImgs(id, d.frames);
    });
    saveDraft(); renderList(); renderProps(); renderTimeline();
    return Object.keys(src).length;
  }
  function packText() { return JSON.stringify(buildPack(), null, 2); }
  function dataText() {
    return '// 由招式工作台导出 · 覆盖 dawn-s1/art-overrides.data.js 后执行 node build.js\n' +
      'window.__ART_OVERRIDES_FILE__ = ' + JSON.stringify(buildPack()) + ';\n';
  }
  function download(name, text) {
    var b = new Blob([text], { type: 'application/octet-stream' });
    var u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
  }
  $('btnJson').onclick = function () {
    var n = Object.keys(buildPack().arts).length;
    download('art-overrides.json', packText());
    status('已导出 ' + n + ' 招 → 在游戏「招式」页点「导入工作台覆盖表」选这个文件');
  };
  $('btnData').onclick = function () {
    download('art-overrides.data.js', dataText());
    status('已导出 data.js → 放进 dawn-s1/ 覆盖同名文件，再 node build.js 即永久生效');
  };
  $('btnTry').onclick = function () {
    try {
      localStorage.setItem(OVERRIDE_KEY, packText());
      status('已写入试玩覆盖：若游戏与工作台同一 http 源，刷新游戏页即生效；file:// 下请用 JSON 导入');
    } catch (e) { status('写不进 localStorage：' + e.message + '，请用 JSON 导入'); }
  };
  $('btnCopy').onclick = function () {
    var txt = packText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { status('导入码已复制（' + txt.length + ' 字符）'); },
        function () { status('复制被浏览器拦了，请改用下载 JSON'); });
    } else {
      var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); status('导入码已复制'); } catch (e) { status('复制失败，请下载 JSON'); }
      ta.remove();
    }
  };
  $('btnImport').onclick = function () { $('jsonFile').click(); };
  $('jsonFile').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var n = importPack(String(r.result));
        status('已导入 ' + n + ' 招草稿，可以继续改了');
        $('jsonFile').value = '';
      } catch (e) { status('草稿格式不对：' + e.message); }
    };
    r.readAsText(f);
  };
  // 原地清空：window.__wb.draft 是同一个对象引用，重新赋值会让自检拿到旧快照。
  function clearDraft() {
    Object.keys(draft).forEach(function (k) { delete draft[k]; });
    frameImgs = {};
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) { }
    renderList(); renderProps(); renderTimeline();
  }
  $('btnClear').onclick = function () {
    if (!confirm('清空所有草稿？已导出的文件不受影响。')) return;
    clearDraft(); status('草稿已清空');
  };

  // ---------- 启动 ----------
  var ids = Object.keys(ARTS);
  if (!ids.length) {
    status('基线数据没内联进来：请在 dawn-s1/ 执行 node tools/gen-artworkbench.js');
  } else {
    curId = ids[0];
    renderList(); renderProps(); renderTimeline();
    status('已载入 ' + ids.length + ' 招基线 · ' + Object.keys(draft).length + ' 招草稿');
  }
  requestAnimationFrame(loop);

  // 给自检脚本用的接口
  window.__wb = {
    base: BASE, draft: draft, get curId() { return curId; },
    select: function (id) { if (ARTS[id]) { curId = id; frame = 0; renderList(); renderProps(); renderTimeline(); } },
    cur: cur, curFor: curFor, buildPack: buildPack, packText: packText, dataText: dataText,
    setField: setField, setTl: setTl, setPose: setPose,
    setFrame: function (f) { frame = f; updatePointer(); draw(); },
    importPack: importPack,
    clear: clearDraft
  };
  window.__wbReady = true;
})();
</script>
</body>
</html>
