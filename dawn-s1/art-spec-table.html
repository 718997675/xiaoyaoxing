<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>技能演出规范表 · 剩余 64 招（逐招拍板）</title>
<style>
:root{
  --bg:#f7f6f4; --card:#ffffff; --ink:#232229; --dim:#6d6b76; --hint:#918f9a;
  --line:rgba(0,0,0,.12); --line2:rgba(0,0,0,.22); --soft:#f1f0ee;
  --pur:#534ab7; --purBg:#eeedfe; --tea:#0f6e56; --teaBg:#e1f5ee;
  --cor:#993c1d; --corBg:#faece7; --red:#a32d2d; --redBg:#fcebeb;
  --amber:#854f0b; --amberBg:#faeeda; --blue:#185fa5; --blueBg:#e6f1fb;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16161a; --card:#202027; --ink:#efeff3; --dim:#a5a3ae; --hint:#85838e;
    --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.28); --soft:#282830;
    --pur:#afa9ec; --purBg:#2c2850; --tea:#5dcaa5; --teaBg:#123a30;
    --cor:#f0997b; --corBg:#43251a; --red:#f09595; --redBg:#3d1c1c;
    --amber:#efc775; --amberBg:#3b2c12; --blue:#85b7ea; --blueBg:#182c40;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1220px;margin:0 auto;padding:26px 18px 80px}
h1{font-size:22px;font-weight:600;margin:0 0 6px}
h2{font-size:16px;font-weight:600;margin:0}
.sub{color:var(--dim);margin:0 0 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 12px;
  border-bottom:1px solid var(--line);margin-bottom:18px}
.topRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;
  background:var(--soft);color:var(--dim);border:1px solid var(--line)}
.pill b{color:var(--ink)}
.pill.ok{background:var(--teaBg);color:var(--tea);border-color:transparent}
.pill.rev{background:var(--amberBg);color:var(--amber);border-color:transparent}
button{font-family:inherit}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line2);
  background:var(--card);color:var(--ink);cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--ink)}
.btn.on{background:var(--purBg);color:var(--pur);border-color:var(--pur)}
.btn.primary{background:var(--pur);color:#fff;border-color:var(--pur)}
.famHead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:30px 0 4px;
  padding-bottom:8px;border-bottom:1px solid var(--line);scroll-margin-top:104px}
.famNav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.famNav button{padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--soft);color:var(--dim);cursor:pointer;font-size:12px}
.famNav button:hover{border-color:var(--ink);color:var(--ink)}
.famNav button b{color:var(--ink);font-weight:600}
.famHead .tone{font-size:12.5px;color:var(--dim)}
.famHead .prog{margin-left:auto;font:11.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--hint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:14px;margin-top:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.art{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;
  transition:border-color .15s,box-shadow .15s}
.art.ok{border-color:var(--tea);box-shadow:0 0 0 1px var(--tea) inset}
.art.rev{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.art.hide{display:none}
.ahead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 14px 10px;
  border-bottom:1px solid var(--line);background:var(--soft)}
.ahead .nm{font-size:15px;font-weight:600}
.ahead .id{font:11.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--hint)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.tag.dmg{background:var(--redBg);color:var(--red);border-color:transparent}
.tag.aoe{background:var(--corBg);color:var(--cor);border-color:transparent}
.tag.move{background:var(--blueBg);color:var(--blue);border-color:transparent}
.tag.ctrl{background:var(--purBg);color:var(--pur);border-color:transparent}
.tag.buff{background:var(--teaBg);color:var(--tea);border-color:transparent}
.tag.special{background:var(--amberBg);color:var(--amber);border-color:transparent}
.nums{margin-left:auto;font:11.5px/1.7 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);text-align:right}
.spec{padding:2px 14px 0}
.row{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-of-type{border-bottom:0}
.row .k{font-size:12px;color:var(--hint);padding-top:1px}
.row .v{font-size:13px;line-height:1.65}
.row .v em{font-style:normal;color:var(--dim)}
.minor{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 12px;
  padding:10px 14px 12px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);
  background:var(--soft);line-height:1.55;align-items:start}
@media(max-width:640px){.minor{grid-template-columns:repeat(2,minmax(0,1fr))}}
.minor b{font-weight:500;color:var(--hint);display:block;margin-bottom:1px}
.act{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.act .btn{padding:5px 12px;font-size:12px}
.act .sp{flex:1}
.note{width:100%;margin:0 14px 12px;padding:8px 10px;border-radius:8px;border:1px solid var(--line2);
  background:var(--bg);color:var(--ink);font:12.5px/1.6 inherit;resize:vertical;min-height:52px;display:none}
.note.show{display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:14px 0 0}
.legend i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.gbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:26px}
.gbox textarea{width:100%;min-height:90px;margin-top:10px;padding:10px;border-radius:8px;
  border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:13px/1.7 inherit;resize:vertical}
.hintline{font-size:12px;color:var(--hint);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">

<h1>技能演出规范表 · 剩余 64 招</h1>
<p class="sub">
  左边是 <code>arts.js</code> 里的真实数值（只读，我不会改），右边是我建议的<b>演出规格</b>。
  每招点「✓ 就这样」或「✎ 要改」并写一句话，我按你拍板的口径一次做完，不再做完再返工。
</p>

<div class="top">
  <div class="topRow">
    <span class="pill">进度 <b id="pOk">0</b> / 64 已通过</span>
    <span class="pill rev" id="pRevBox">要改 <b id="pRev">0</b></span>
    <span class="sp" style="flex:1"></span>
    <button class="btn" data-f="all">全部</button>
    <button class="btn" data-f="todo">未定</button>
    <button class="btn" data-f="rev">要改</button>
    <button class="btn primary" id="exp">导出确认结果</button>
    <button class="btn" id="copy">复制 JSON</button>
    <button class="btn" id="rst">清空</button>
  </div>
  <div class="famNav" id="famNav"></div>
  <div class="legend">
    <span><i style="background:var(--tea)"></i>已通过</span>
    <span><i style="background:var(--amber)"></i>要改（写了备注）</span>
    <span><i style="background:var(--line2)"></i>未定</span>
  </div>
</div>

<div id="app"></div>

<div class="gbox">
  <h2>整体口径备注</h2>
  <p class="hintline">写在这一栏的话我当全局规则处理（例如「所有 buff 招都要 3.4s」「位移招统一不许超过 70px」）。</p>
  <textarea id="gNote" placeholder="例：① 所有远程招的弹道都要看得见飞行过程，不许一帧到达；② 锤族统一双手，不要单手重锤；③ …"></textarea>
</div>

<div class="gbox" id="dumpBox" style="display:none">
  <h2>确认结果 JSON</h2>
  <p class="hintline" id="dumpTip">已展开，全选复制后贴给 AI 即可。</p>
  <textarea id="dump" readonly style="min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px"></textarea>
</div>

</div>

const SLOT = {dmg:'输出', aoe:'清场', move:'位移', ctrl:'控制', buff:'增益', special:'特色'};

/* ---------- 状态 ---------- */
const KEY = 'xyx-art-spec-v1';
let ST = {};
try { ST = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ ST = {}; }
let FILTER = 'all';

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} }

/* ---------- 渲染 ---------- */
const app = document.getElementById('app');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function card(fam, x){
  const st = ST[x.a] || {};
  const cls = st.v === 'ok' ? ' ok' : st.v === 'rev' ? ' rev' : '';
  return `<div class="art${cls}" data-id="${x.a}">
  <div class="ahead">
    <span class="nm">${esc(x.n)}</span>
    <span class="id">${x.a}</span>
    <span class="tag ${x.s}">${SLOT[x.s]}</span>
    <span class="nums">CD ${x.cd}s · 真气 ${x.c} · ${esc(x.mul)}<br>${esc(x.nums)}</span>
  </div>
  <div class="spec">
    <div class="row"><div class="k">空间语言</div><div class="v">${esc(x.sp)}</div></div>
    <div class="row"><div class="k">持械</div><div class="v">${esc(x.g)}</div></div>
    <div class="row"><div class="k">人物位移</div><div class="v">${esc(x.mv)}</div></div>
    <div class="row"><div class="k">判定锚点</div><div class="v">${esc(x.an)}</div></div>
    <div class="row"><div class="k">与相邻招差异</div><div class="v">${esc(x.vs)}</div></div>
    <div class="row"><div class="k">画面语言</div><div class="v"><em>${esc(x.lk)}</em></div></div>
  </div>
  <div class="minor">
    <span><b>平面</b> ${esc(x.pl)}</span>
    <span><b>残影</b> ${esc(x.gh)}</span>
    <span><b>顿帧</b> ${esc(x.st)}</span>
    <span><b>时长</b> ${esc(x.du)}</span>
  </div>
  <div class="act">
    <button class="btn" data-act="ok" data-id="${x.a}">✓ 就这样</button>
    <button class="btn" data-act="rev" data-id="${x.a}">✎ 要改</button>
    <span class="sp"></span>
    <span class="id" data-state="${x.a}">${st.v === 'ok' ? '已通过' : st.v === 'rev' ? '待改' : '未定'}</span>
  </div>
  <textarea class="note${st.v === 'rev' ? ' show' : ''}" data-note="${x.a}"
    placeholder="要改哪里？一句话就够（例：位移改成 30px、不要贴地、判定改到落地那帧）">${esc(st.n || '')}</textarea>
</div>`;
}

function render(){
  app.innerHTML = FAMS.map(f => {
    const todo = f.arts.filter(x => !(ST[x.a] && ST[x.a].v)).length;
    return `<div class="famHead">
      <h2>${esc(f.name)}</h2>
      <span class="tone">${esc(f.tone)}</span>
      <span class="prog">已审 ${f.done} / 8 · 本表剩 ${f.arts.length} 招 · 未定 ${todo}</span>
    </div>
    <div class="grid">${f.arts.map(x => card(f, x)).join('')}</div>`;
  }).join('');
  document.getElementById('famNav').innerHTML = FAMS.map((f, i) =>
    `<button data-jump="${i}"><b>${esc(f.name.split(' · ')[0])}</b> ${f.arts.length}</button>`).join('');
  applyFilter();
  count();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-jump]');
  if (!b) return;
  const hs = document.querySelectorAll('.famHead');
  const t = hs[+b.dataset.jump];
  if (t) t.scrollIntoView({ behavior:'smooth', block:'start' });
});

function count(){
  let ok = 0, rev = 0;
  for (const k in ST){ if (ST[k].v === 'ok') ok++; else if (ST[k].v === 'rev') rev++; }
  document.getElementById('pOk').textContent = ok;
  document.getElementById('pRev').textContent = rev;
}

function applyFilter(){
  document.querySelectorAll('.art').forEach(el => {
    const s = ST[el.dataset.id] || {};
    let show = true;
    if (FILTER === 'todo') show = !s.v;
    else if (FILTER === 'rev') show = s.v === 'rev';
    el.classList.toggle('hide', !show);
  });
}

app.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  ST[id] = ST[id] || {};
  ST[id].v = (ST[id].v === act) ? undefined : act;
  if (!ST[id].v) delete ST[id].v;
  save(); render();
});

app.addEventListener('input', e => {
  const t = e.target.closest('textarea[data-note]');
  if (!t) return;
  const id = t.dataset.note;
  ST[id] = ST[id] || {};
  ST[id].n = t.value;
  if (t.value.trim() && !ST[id].v){ ST[id].v = 'rev'; save(); render(); }
  else save();
});

document.querySelectorAll('[data-f]').forEach(b => {
  b.onclick = () => {
    FILTER = b.dataset.f;
    document.querySelectorAll('[data-f]').forEach(o => o.classList.toggle('on', o === b));
    applyFilter();
  };
});

document.getElementById('gNote').value = ST.__global || '';
document.getElementById('gNote').oninput = e => { ST.__global = e.target.value; save(); };

/* 只导出「有勾选或写了备注」的招，其余算默认走 —— JSON 短，好复制 */
function buildJSON(){
  const changed = {}, untouched = [];
  FAMS.forEach(f => f.arts.forEach(x => {
    const s = ST[x.a] || {};
    if (s.v || (s.n && s.n.trim())) {
      changed[x.a] = { v: s.v || 'rev', note: (s.n || '').trim(), name: x.n, fam: f.id };
    } else untouched.push(x.a);
  }));
  return JSON.stringify({
    global: ST.__global || '',
    changedCount: Object.keys(changed).length,
    untouchedCount: untouched.length,
    changed: changed,
  }, null, 2);
}

document.getElementById('exp').onclick = () => {
  const blob = new Blob([buildJSON()], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'art-spec-confirm.json';
  a.click();
};

document.getElementById('copy').onclick = async () => {
  const j = buildJSON();
  const box = document.getElementById('dumpBox');
  const ta = document.getElementById('dump');
  const tip = document.getElementById('dumpTip');
  box.style.display = 'block';
  ta.value = j;
  ta.focus(); ta.select();
  let copied = false;
  try { await navigator.clipboard.writeText(j); copied = true; } catch(e){}
  if (!copied) { try { copied = document.execCommand('copy'); } catch(e){} }
  tip.textContent = copied
    ? '已复制到剪贴板（' + j.length + ' 字符），直接粘给我就行。'
    : '剪贴板不可用，已展开在下面，手动全选复制。';
  box.scrollIntoView({ behavior:'smooth', block:'center' });
};

document.getElementById('rst').onclick = () => {
  if (!confirm('清空所有勾选和备注？')) return;
  ST = {}; save(); render();
  document.getElementById('gNote').value = '';
};

render();

/* 给 tools/run.js 的就绪标记 + 自检接口 */
window.__spec = { fams: FAMS, slot: SLOT, state: () => ST };
window.__wbReady = true;
window.__abReady = true;
</script>
