<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>逍遥行 · 素材切图工具</title>
<style>
  :root{--ink:#12161F;--paper:#E8DFC8;--paper2:#C9BFA3;--gold:#8A6520;--jade:#2F6E6A}
  body{margin:0;background:#12161F;color:#E8DFC8;font:13px/1.7 "PingFang SC",SimSun,monospace;padding:18px 22px}
  h1{font-size:18px;letter-spacing:4px;margin:0 0 4px}
  .sub{color:#8A8268;font-size:12px;margin-bottom:14px}
  .row{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .card{background:#1B2230;border:1px solid #2A3140;padding:12px 14px;border-radius:2px;min-width:250px}
  .card h3{margin:0 0 8px;font-size:12px;letter-spacing:2px;color:#D9A441;font-weight:normal}
  label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0;font-size:12px;color:#C9BFA3}
  input[type=number],input[type=text],select{width:88px;background:#0F141C;border:1px solid #3A4356;color:#E8DFC8;padding:3px 5px;font:12px monospace}
  select{width:120px}
  button{background:#C9BFA3;border:2px solid #000;color:#12161F;padding:6px 12px;font:13px SimSun;letter-spacing:2px;cursor:pointer;margin:6px 6px 0 0}
  button:hover{background:#D9A441}
  button:disabled{opacity:.4;cursor:not-allowed}
  #drop{border:2px dashed #3A4356;padding:26px;text-align:center;color:#8A8268;cursor:pointer}
  #drop.on{border-color:#D9A441;color:#D9A441}
  canvas{image-rendering:pixelated;background:#0F141C;border:1px solid #2A3140;max-width:100%}
  #stageWrap{position:relative;display:inline-block}
  #overlay{position:absolute;left:0;top:0;pointer-events:none}
  .hint{color:#8A8268;font-size:11px;line-height:1.6}
  code{color:#9BD4CC}
  #log{color:#9BD4CC;font-size:11px;white-space:pre-wrap;max-width:520px}
</style>
</head>
<body>
<h1>素材切图工具</h1>
<div class="sub">把 AI 生成的「多宫格素材图」切成游戏能读的 atlas.json。全程本地处理，不上传。</div>

<div class="row">
  <div class="card" style="flex:1">
    <h3>1 · 放入整张素材图</h3>
    <div id="drop">拖入图片 / 点击选择 / ⌘V 粘贴<br><span class="hint">建议一张图里整齐排 3×2 或 4×4 格，纯色背景（洋红 #FF00FF 或纯绿）</span></div>
    <input id="file" type="file" accept="image/*" style="display:none">
    <div id="stageWrap" style="margin-top:10px"><canvas id="stage"></canvas><canvas id="overlay"></canvas></div>
  </div>

  <div class="card">
    <h3>2 · 网格与抠图</h3>
    <label>列数 <input id="cols" type="number" value="3" min="1" max="12"></label>
    <label>行数 <input id="rows" type="number" value="2" min="1" max="12"></label>
    <label>格子间距 <input id="gap" type="number" value="0" min="0" max="64"></label>
    <label>外边距 <input id="margin" type="number" value="0" min="0" max="120"></label>
    <label>背景容差 <input id="tol" type="number" value="32" min="0" max="160"></label>
    <label>取角落色 <button id="pickKey" style="padding:2px 8px;font-size:11px">吸色</button></label>
    <label>输出尺寸 <input id="cell" type="number" value="32" min="8" max="128"></label>
    <label>素材类别
      <select id="kind">
        <option value="weapons">兵器（手持/图标）</option>
        <option value="icons">装备图标（衣甲/项链/法宝）</option>
        <option value="monsters">怪物（单帧）</option>
      </select>
    </label>
    <div id="order" class="hint" style="margin-top:8px"></div>
  </div>

  <div class="card" style="min-width:300px">
    <h3>3 · 预览与导出</h3>
    <canvas id="preview" width="300" height="150"></canvas>
    <div id="log" style="margin-top:8px"></div>
    <button id="build">生成预览</button>
    <button id="export" disabled>导出 atlas.json</button>
    <div class="hint" style="margin-top:10px">
      导出后放到 <code>dawn-s1/assets/atlas.json</code>，刷新游戏即生效。<br>
      兵器图请竖直摆放（刃上柄下、柄端贴底边中点），游戏中以柄端为轴旋转挥砍。
    </div>
  </div>
</div>

<script>
const WEAPON_ORDER = ['sword','blade','spear','staff','dual','hammer'];
const ICON_ORDER = ['armor','necklace','artifact'];
const MONSTER_ORDER = ['zhiren','fox','ghost','brute','shadow','shanxiao','snake','fukui','crow','shigan','yinhun','treant','boss'];
const CN = {
  sword:'剑',blade:'刀',spear:'枪',staff:'棍',dual:'双刃',hammer:'锤',
  armor:'衣甲',necklace:'项链',artifact:'法宝',
  zhiren:'山贼',fox:'恶犬',ghost:'弓手',brute:'壮汉',shadow:'影刺客',shanxiao:'山魈',
  snake:'赤练蛇',fukui:'符傀',crow:'火鸦',shigan:'石敢当',yinhun:'阴魂',treant:'树妖',boss:'寨主'
};

const $ = id => document.getElementById(id);
let img = null, keyColor = null, lastAtlas = null;

function order() {
  const k = $('kind').value;
  if (k === 'weapons') return WEAPON_ORDER;
  if (k === 'icons') return ICON_ORDER;
  return MONSTER_ORDER;
}
function paintOrder() {
  const list = order();
  $('order').innerHTML = '格子顺序（从左到右、从上到下）：<br>' +
    list.map((n, i) => `<span style="color:#9BD4CC">${i + 1}.${CN[n] || n}</span>`).join('　');
}
$('kind').onchange = paintOrder;
paintOrder();

function drawStage() {
  const st = $('stage'), ov = $('overlay');
  if (!img) { st.width = 0; st.height = 0; ov.width = 0; ov.height = 0; return; }
  const maxW = 620;
  const sc = Math.min(1, maxW / img.width);
  st.width = Math.round(img.width * sc); st.height = Math.round(img.height * sc);
  ov.width = st.width; ov.height = st.height;
  st.style.width = st.width + 'px'; st.style.height = st.height + 'px';
  const g = st.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(img, 0, 0, st.width, st.height);
  drawGrid(sc);
}
function drawGrid(sc) {
  const ov = $('overlay'), g = ov.getContext('2d');
  g.clearRect(0, 0, ov.width, ov.height);
  const cols = +$('cols').value, rows = +$('rows').value;
  const gap = +$('gap').value, m = +$('margin').value;
  const cw = (img.width - m * 2 - gap * (cols - 1)) / cols;
  const ch = (img.height - m * 2 - gap * (rows - 1)) / rows;
  g.strokeStyle = 'rgba(217,164,65,.9)'; g.lineWidth = 1;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    g.strokeRect(Math.round((m + c * (cw + gap)) * sc) + .5, Math.round((m + r * (ch + gap)) * sc) + .5,
      Math.round(cw * sc), Math.round(ch * sc));
  }
}
['cols','rows','gap','margin'].forEach(id => $(id).oninput = () => { if (img) drawStage(); });

function loadFile(f) {
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => { img = im; $('log').textContent = `已载入 ${im.width}×${im.height}`; drawStage(); autoKey(); };
  im.src = url;
}
$('drop').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };
['dragover', 'dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('on'); }));
['dragleave', 'drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('on'); }));
$('drop').addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
addEventListener('paste', e => {
  const it = [...(e.clipboardData || {}).items || []].find(i => i.type.startsWith('image'));
  if (it) loadFile(it.getAsFile());
});

function px(x, y) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  return g.getImageData(x, y, 1, 1).data;
}
function autoKey() {
  if (!img) return;
  const d = px(0, 0);
  keyColor = [d[0], d[1], d[2]];
  $('log').textContent += `\n背景色 rgb(${keyColor.join(',')})`;
}
$('pickKey').onclick = () => {
  const tip = document.createElement('div');
  tip.textContent = '点图上背景处取色';
  $('log').textContent = '请在左侧图上点击背景区域…';
  $('stage').onclick = e => {
    const r = $('stage').getBoundingClientRect();
    const x = Math.round((e.clientX - r.left) / r.width * img.width);
    const y = Math.round((e.clientY - r.top) / r.height * img.height);
    const d = px(x, y);
    keyColor = [d[0], d[1], d[2]];
    $('log').textContent = `背景色 rgb(${keyColor.join(',')})  (${x},${y})`;
    $('stage').onclick = null;
  };
};

// 抠背景 + 裁掉透明边 + 居中缩放
function cutCell(sx, sy, sw, sh, key, tol, target) {
  const src = document.createElement('canvas');
  src.width = Math.round(sw); src.height = Math.round(sh);
  const g = src.getContext('2d');
  g.drawImage(img, Math.round(sx), Math.round(sy), src.width, src.height, 0, 0, src.width, src.height);
  const data = g.getImageData(0, 0, src.width, src.height);
  const p = data.data;
  let minX = src.width, minY = src.height, maxX = -1, maxY = -1;
  for (let y = 0; y < src.height; y++) for (let x = 0; x < src.width; x++) {
    const i = (y * src.width + x) * 4;
    const d = Math.abs(p[i] - key[0]) + Math.abs(p[i + 1] - key[1]) + Math.abs(p[i + 2] - key[2]);
    if (d <= tol) { p[i + 3] = 0; continue; }
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  g.putImageData(data, 0, 0);
  const out = document.createElement('canvas');
  out.width = target; out.height = target;
  const og = out.getContext('2d');
  og.imageSmoothingEnabled = false;
  if (maxX < 0) return out;
  const cw = maxX - minX + 1, chh = maxY - minY + 1;
  const k = Math.min(target / cw, target / chh);
  const dw = Math.max(1, Math.round(cw * k)), dh = Math.max(1, Math.round(chh * k));
  og.drawImage(src, minX, minY, cw, chh, Math.round((target - dw) / 2), Math.round((target - dh) / 2), dw, dh);
  return out;
}

function build() {
  if (!img) { $('log').textContent = '先放入图片'; return; }
  const cols = +$('cols').value, rows = +$('rows').value;
  const gap = +$('gap').value, m = +$('margin').value;
  const tol = +$('tol').value, target = +$('cell').value;
  const key = keyColor || [255, 0, 255];
  const cw = (img.width - m * 2 - gap * (cols - 1)) / cols;
  const ch = (img.height - m * 2 - gap * (rows - 1)) / rows;
  const list = order();
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    cells.push(cutCell(m + c * (cw + gap), m + r * (ch + gap), cw, ch, key, tol, target));
  }
  const used = Math.min(cells.length, list.length);
  // 预览
  const pv = $('preview'), pg = pv.getContext('2d');
  pg.clearRect(0, 0, pv.width, pv.height);
  pg.fillStyle = '#0F141C'; pg.fillRect(0, 0, pv.width, pv.height);
  pg.imageSmoothingEnabled = false;
  const per = 6, sz = 44;
  for (let i = 0; i < used; i++) {
    const x = 8 + (i % per) * (sz + 4), y = 8 + Math.floor(i / per) * (sz + 22);
    pg.drawImage(cells[i], x, y, sz, sz);
    pg.fillStyle = '#9BD4CC'; pg.font = '10px monospace';
    pg.fillText(CN[list[i]] || list[i], x, y + sz + 11);
  }
  // 打包
  const cat = $('kind').value;
  const atlas = { version: 1 };
  if (cat === 'weapons') { atlas.weapons = {}; }
  else if (cat === 'icons') { atlas.icons = {}; }
  else { atlas.monsters = {}; }
  for (let i = 0; i < used; i++) {
    const durl = cells[i].toDataURL('image/png');
    const n = list[i];
    if (cat === 'weapons') atlas.weapons[n] = durl;
    else if (cat === 'icons') atlas.icons[n] = durl;
    else atlas.monsters[n] = { w: target, h: target, frames: [durl] };
  }
  lastAtlas = { cat, atlas };
  $('export').disabled = false;
  $('log').textContent = `识别 ${used} 格，目标 ${target}×${target}。若切歪了，调「外边距/间距/列行」。`;
}

$('build').onclick = build;
$('export').onclick = () => {
  if (!lastAtlas) return;
  // 若已有 atlas.json 可手动合并：这里直接导出当前类别，文件名带类别
  const blob = new Blob([JSON.stringify(lastAtlas.atlas, null, 0)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'atlas-' + lastAtlas.cat + '.json';
  a.click();
  $('log').textContent = '已导出。把内容合并到 assets/atlas.json（不同类别可放在同一个对象的 weapons/icons/monsters 键下）。';
};
</script>
</body>
</html>
